# 加到 xslaoxu.cn 的 server 块里。
#
# 静态站，用 alias 直接发文件，不经过 proxy_pass —— 服务器全局那个
# proxy_cache cache_one（慧客堂和 Sankey 都踩过的坑）在这里天然不存在。
#
# 注意 nginx 的 add_header 不继承：子 location 里一旦出现任何 add_header，
# 父级的会全部失效，所以下面每个子块都把安全头重复了一遍。

# 下载限速需要的共享内存区，放在 http 块里（宝塔：/www/server/nginx/conf/nginx.conf）
# limit_conn_zone $binary_remote_addr zone=dl:10m;

location = /learn-ai { return 301 /learn-ai/; }

location ^~ /learn-ai/ {
    alias /www/wwwroot/learn-ai/dist/;
    try_files $uri $uri/index.html $uri.html =404;

    add_header Referrer-Policy   "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;

    # 静态资源长缓存
    location ~* ^/learn-ai/assets/.*\.(css|js|png|jpg|svg|woff2)$ {
        add_header Referrer-Policy   "strict-origin-when-cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=604800" always;
    }

    # HTML 不缓存，改了就能看到
    location ~* ^/learn-ai/.*\.html$ {
        add_header Referrer-Policy   "strict-origin-when-cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-cache" always;
    }

    # 下载包：服务器只有 4 Mbps 上行，必须限速限并发，
    # 否则一个人拉包就把另外几个服务一起拖慢
    location ~* ^/learn-ai/download/ {
        add_header Referrer-Policy   "strict-origin-when-cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=604800" always;
        limit_rate_after 2m;   # 前 2 MB 全速
        limit_rate 256k;       # 之后压到半条管子
        limit_conn dl 1;       # 一个 IP 同时只能拉一个
    }
}
